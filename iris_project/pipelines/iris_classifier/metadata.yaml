blocks:
  - uuid: load_iris
    name: load_iris
    language: python
    type: data_loader
    status: executed
    upstream_blocks: []
    downstream_blocks:
      - check_data_quality
    file_path: data_loaders/load_iris.py
    configuration: {}

  - uuid: check_data_quality
    name: check_data_quality
    language: python
    type: transformer
    status: executed
    upstream_blocks:
      - load_iris
    downstream_blocks:
      - prepare_data
    file_path: transformers/check_data_quality.py
    configuration: {}

  - uuid: prepare_data
    name: prepare_data
    language: python
    type: transformer
    status: executed
    upstream_blocks:
      - check_data_quality
    downstream_blocks:
      - train_model
    file_path: transformers/prepare_data.py
    configuration: {}

  - uuid: train_model
    name: train_model
    language: python
    type: transformer
    status: executed
    upstream_blocks:
      - prepare_data
    downstream_blocks:
      - save_results
      - evaluate_model
    file_path: transformers/train_model.py
    configuration: {}

  - uuid: save_results
    name: save_results
    language: python
    type: data_exporter
    status: executed
    upstream_blocks:
      - train_model
    downstream_blocks: []
    file_path: data_exporters/save_results.py
    configuration: {}

  - uuid: evaluate_model
    name: evaluate_model
    language: python
    type: data_exporter
    status: executed
    upstream_blocks:
      - train_model
    downstream_blocks: []
    file_path: data_exporters/evaluate_model.py
    configuration: {}

name: iris_classifier
type: python
uuid: iris_classifier
description: >
  Iris classification pipeline: load -> quality_check -> prepare -> train -> (save | evaluate).
executor_type: local_python
run_pipeline_in_one_process: false
